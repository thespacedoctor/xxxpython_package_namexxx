name: Tests

# RUNS THE TEST SUITE ON EVERY PULL REQUEST INTO main OR develop AND ON EVERY PUSH TO develop.
# REQUIRE THE "tests" CHECK ON main SO RELEASE PULL REQUESTS AUTO-MERGE ONLY WHEN IT PASSES.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # PIN THE MINIMUM SUPPORTED PYTHON; python-version-file PICKS THE NEWEST RELEASE, WHICH MAY BREAK DEPENDENCIES
          python-version: "3.14"
          architecture: x64
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[tests]"

      - name: Run tests
        run: python -m pytest -m "not slow and not full"
